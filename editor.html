document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');

        e.target.tagName, String(e.target.src || e.target.href || ''));

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    }

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin

      // and sender identity (own child frame / direct parent) is checked

      return (

    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;

        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {

rder-radius:7px;font-size:14px;background:#fff;color:#35322b;\">\n          <label style=\"font-size:11px;color:#7c7364;font-weight:600;\">Fill colour<\u002Flabel>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px;\">\n            <sc-for list=\"{{swatches}}\" as=\"s\" hint-placeholder-count=\"6\">\n              <div sc-camel-on-click=\"{{ s.onPick }}\" style=\"{{ s.style }}\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#948c7d;line-height:1.7;margin-bottom:16px;\">{{ selDims }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ rotateRoomSel }}\" style=\"width:100%;margin-bottom:8px;padding:9px;border:1px solid #c4bcab;background:#efeae0;color:#35322b;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Rotate 90°<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ duplicateSel }}\" style=\"width:100%;margin-bottom:8px;padding:9px;border:1px solid #c4bcab;background:#efeae0;color:#35322b;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Duplicate room<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ deleteSel }}\" style=\"width:100%;padding:9px;border:1px solid #c98a6a;background:#f3e3db;color:#9a4a28;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Delete room<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isOpenSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#a09889;font-weight:700;margin-bottom:12px;\">{{ openKind }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#948c7d;line-height:1.7;margin-bottom:16px;\">Drag it along the wall to reposition. Use the flip button to swing a door the other way.<\u002Fdiv>\n          <sc-if value=\"{{ isDoorSel }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ flipDoor }}\" style=\"width:100%;margin-bottom:8px;padding:9px;border:1px solid #c4bcab;background:#efeae0;color:#35322b;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Flip swing<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ swingOut }}\" style=\"width:100%;margin-bottom:8px;padding:9px;border:1px solid #c4bcab;background:#efeae0;color:#35322b;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Swing outward<\u002Fbutton>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ deleteSel }}\" style=\"width:100%;padding:9px;border:1px solid #c98a6a;background:#f3e3db;color:#9a4a28;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Delete<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isWallSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#a09889;font-weight:700;margin-bottom:12px;\">WALL<\u002Fdiv>\n          <div style=\"font-size:12px;color:#948c7d;line-height:1.7;margin-bottom:16px;\">Free-standing wall. Drag to move it, or drag its handles to resize / lengthen.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ deleteSel }}\" style=\"width:100%;padding:9px;border:1px solid #c98a6a;background:#f3e3db;color:#9a4a28;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Delete wall<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isFurnSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#a09889;font-weight:700;margin-bottom:12px;\">{{ furnLabel }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#948c7d;line-height:1.7;margin-bottom:16px;\">Drag to move it, or resize with handles.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ deleteSel }}\" style=\"width:100%;padding:9px;border:1px solid #c98a6a;background:#f3e3db;color:#9a4a28;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Delete<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRailingSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#a09889;font-weight:700;margin-bottom:12px;\">RAILING / HANDRAIL<\u002Fdiv>\n          <div style=\"font-size:12px;color:#948c7d;line-height:1.7;margin-bottom:16px;\">A balcony handrail (~3½′ high with balusters). Drag to move it, or resize with handles to lengthen.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ deleteSel }}\" style=\"width:100%;padding:9px;border:1px solid #c98a6a;background:#f3e3db;color:#9a4a28;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Delete railing<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isTileSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#a09889;font-weight:700;margin-bottom:12px;\">TILE AREA<\u002Fdiv>\n          <div style=\"font-size:12px;color:#948c7d;line-height:1.7;margin-bottom:16px;\">Paved tile section (e.g. courtyard). Does not count toward square footage. Drag to move, or resize with handles.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ deleteSel }}\" style=\"width:100%;padding:9px;border:1px solid #c98a6a;background:#f3e3db;color:#9a4a28;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Delete tile area<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isPlantSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#a09889;font-weight:700;margin-bottom:12px;\">PLANT<\u002Fdiv>\n          <div style=\"font-size:12px;color:#948c7d;line-height:1.7;margin-bottom:16px;\">A shrub / tree. Drag to move it, or resize with handles for a bigger plant.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ deleteSel }}\" style=\"width:100%;padding:9px;border:1px solid #c98a6a;background:#f3e3db;color:#9a4a28;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Delete plant<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isIslandSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#a09889;font-weight:700;margin-bottom:12px;\">KITCHEN ISLAND<\u002Fdiv>\n          <div style=\"font-size:12px;color:#948c7d;line-height:1.7;margin-bottom:16px;\">Free-standing counter. Drag to move it anywhere, or drag its handles to resize.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ deleteSel }}\" style=\"width:100%;padding:9px;border:1px solid #c98a6a;background:#f3e3db;color:#9a4a28;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Delete island<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isStairSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#a09889;font-weight:700;margin-bottom:12px;\">STAIRS<\u002Fdiv>\n          <label style=\"font-size:11px;color:#7c7364;font-weight:600;\">Shape<\u002Flabel>\n          <div style=\"display:flex;flex-direction:column;gap:6px;margin:8px 0 18px;\">\n            <sc-for list=\"{{shapeBtns}}\" as=\"b\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ b.onClick }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <label style=\"font-size:11px;color:#7c7364;font-weight:600;\">Landing / direction<\u002Flabel>\n          <div style=\"display:flex;flex-direction:column;gap:6px;margin:8px 0 18px;\">\n            <sc-for list=\"{{stairOpts}}\" as=\"op2\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ op2.onClick }}\" style=\"{{ op2.style }}\">{{ op2.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ deleteSel }}\" style=\"width:100%;padding:9px;border:1px solid #c98a6a;background:#f3e3db;color:#9a4a28;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Delete stairs<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isCabSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#a09889;font-weight:700;margin-bottom:12px;\">{{ cabKind }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#948c7d;line-height:1.7;margin-bottom:16px;\">Runs along the wall inside the room. Drag it to reposition, or resize the run.<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;margin-bottom:8px;\">\n            <button sc-camel-on-click=\"{{ narrowOpen }}\" style=\"flex:1;padding:9px;border:1px solid #c4bcab;background:#efeae0;color:#35322b;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">– Shorter<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ widenOpen }}\" style=\"flex:1;padding:9px;border:1px solid #c4bcab;background:#efeae0;color:#35322b;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Longer +<\u002Fbutton>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ deleteSel }}\" style=\"width:100%;padding:9px;border:1px solid #c98a6a;background:#f3e3db;color:#9a4a28;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Delete cabinet<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isOpenWallSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#a09889;font-weight:700;margin-bottom:12px;\">OPEN WALL<\u002Fdiv>\n          <div style=\"font-size:12px;color:#948c7d;line-height:1.7;margin-bottom:16px;\">This wall segment is removed, joining the two rooms. Drag it along the wall to reposition, resize it, or open the wall completely.<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;margin-bottom:8px;\">\n            <button sc-camel-on-click=\"{{ narrowOpen }}\" style=\"flex:1;padding:9px;border:1px solid #c4bcab;background:#efeae0;color:#35322b;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">– Narrower<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ widenOpen }}\" style=\"flex:1;padding:9px;border:1px solid #c4bcab;background:#efeae0;color:#35322b;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Wider +<\u002Fbutton>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ fullWall }}\" style=\"width:100%;margin-bottom:8px;padding:9px;border:1px solid #b06a43;background:#f4e7de;color:#8f5233;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Remove entire wall<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ deleteSel }}\" style=\"width:100%;padding:9px;border:1px solid #c4bcab;background:#efeae0;color:#35322b;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Restore wall<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ groupSel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#a09889;font-weight:700;margin-bottom:12px;\">SELECTION · {{ groupCount }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:#948c7d;line-height:1.7;margin-bottom:16px;\">Drag any selected room to move them together. Lift the whole selection to stack it as a second story in the 3D views.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ liftGroup }}\" style=\"width:100%;margin-bottom:8px;padding:9px;border:1px solid #b8552f;background:#f4e7de;color:#8f3f1f;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">{{ liftLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ deleteSel }}\" style=\"width:100%;padding:9px;border:1px solid #c98a6a;background:#f3e3db;color:#9a4a28;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;\">Delete selection<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ nothingSel }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size:12.5px;color:#948c7d;line-height:1.8;\">\n          <div style=\"font-size:10px;letter-spacing:2px;color:#a09889;font-weight:700;margin-bottom:12px;\">AREA<\u002Fdiv>\n          <div style=\"border:1px solid #e2dccd;border-radius:9px;overflow:hidden;margin-bottom:20px;\">\n            <sc-for list=\"{{areaRows}}\" as=\"a\" hint-placeholder-count=\"3\">\n              <div style=\"{{ a.style }}\">\n                <span style=\"color:#5c564b;\">{{ a.name }}<\u002Fspan>\n                <span style=\"font-variant-numeric:tabular-nums;color:#7c7364;font-weight:600;\">{{ a.sqft }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"display:flex;justify-content:space-between;padding:11px 12px;background:#33302a;color:#f6f3ec;font-size:12.5px;font-weight:700;letter-spacing:0.4px;\">\n              <span>{{ areaTotalLabel }}<\u002Fspan>\n              <span style=\"font-variant-numeric:tabular-nums;\">{{ areaTotal }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:10px;letter-spacing:2px;color:#a09889;font-weight:700;margin-bottom:14px;\">HOW TO USE<\u002Fdiv>\n          <p style=\"margin:0 0 12px;\"><b style=\"color:#5c564b;\">Add a room<\u002Fb> — pick the Room tool, then drag on the grid.<\u002Fp>\n          <p style=\"margin:0 0 12px;\"><b style=\"color:#5c564b;\">Move / stretch<\u002Fb> — with Select, drag a room to move it, or drag its handles to resize. Edges snap to the grid and to nearby rooms so they connect cleanly.<\u002Fp>\n          <p style=\"margin:0 0 12px;\"><b style=\"color:#5c564b;\">Doors &amp; windows<\u002Fb> — pick the tool, then click on any wall. Drag them along the wall afterwards.<\u002Fp>\n          <p style=\"margin:0 0 12px;\"><b style=\"color:#5c564b;\">Open wall<\u002Fb> — for open-concept spaces: pick <b>Open wall<\u002Fb> and click a wall shared by two rooms to remove that segment. Resize it or remove the whole wall from its panel.<\u002Fp>\n          <p style=\"margin:0 0 12px;\"><b style=\"color:#5c564b;\">Stairs<\u002Fb> — pick <b>Stairs<\u002Fb> and drag out a box. Then choose Straight, L-shaped, or U-shaped (switchback), and set which side the landing turns.<\u002Fp>\n          <p style=\"margin:0 0 12px;\"><b style=\"color:#5c564b;\">Floors<\u002Fb> — add tabs for each level; each keeps its own plan.<\u002Fp>\n          <p style=\"margin:0 0 12px;\"><b style=\"color:#5c564b;\">Saving<\u002Fb> — your work auto-saves in this browser. Use <b>Save file<\u002Fb> to download a copy and <b>Open file<\u002Fb> to reload it later.<\u002Fp>\n          <p style=\"margin:0;\"><b style=\"color:#5c564b;\">Switching plans<\u002Fb> — <b>Spanish house<\u002Fb> and <b>New house<\u002Fb> load those saved plans. Hit <b>Save file<\u002Fb> first if you have unsaved changes.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}\">\nconst GRID = 10, SNAP = 6, MIN = 20, DOOR = 30, WIN = 30;\nconst SW = ['#ece5d6','#eae4d7','#e4e8e6','#efece4','#efe9dc','#e8dfe0','#dfe6e4','#f6f3ec'];\nconst WALL = '#33302a', ACCENT = '#b06a43';\n\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    let init = null;\n    try { const raw = localStorage.getItem('fpstudio_v1'); if (raw) init = JSON.parse(raw); } catch(e){}\n    this.state = init && init.floors ? init : {\n      floors: [{ name:'Level 1', rooms:[\n        { id:'r1', x:180, y:160, w:280, h:220, name:'Living Room', color:'#ece5d6' },\n        { id:'r2', x:460, y:160, w:220, h:220, name:'Kitchen', color:'#eae4d7' }\n      ], openings:[\n        { id:'o1', roomId:'r1', side:'right', off:110, kind:'door', flip:false },\n        { id:'o2', roomId:'r1', side:'top', off:140, kind:'window' }\n      ], stairs:[] }],\n      active: 0, tool:'select', selId:null, selType:null\n    };\n    this._n = 100;\n    try {\n      let mx = 100;\n      (this.state.floors||[]).forEach(f=>{\n        [...(f.rooms||[]), ...(f.openings||[]), ...(f.stairs||[])].forEach(it=>{\n          const m = /(\\d+)$/.exec(it.id||''); if (m) mx = Math.max(mx, parseInt(m[1],10)+1);\n        });\n      });\n      this._n = mx;\n    } catch(e){}\n  }\n  uid(p){ return p + (this._n++); }\n  snapshot(){\n    const snap = JSON.stringify(this.state.floors);\n    if (this._history && this._history[this._history.length-1]===snap) return;\n    this._history = this._history || [];\n    this._history.push(snap);\n    if (this._history.length>80) this._history.shift();\n  }\n  undo(){\n    if (!this._history || !this._history.length) return;\n    const prev = this._history.pop();\n    try { this.setState({ floors: JSON.parse(prev), selId:null, selType:null }); } catch(e){}\n  }\n\n  componentDidMount(){\n    this._move = (e)=>this.onMove(e);\n    this._up = (e)=>this.onUp(e);\n    this._key = (e)=>{\n      const tag = (e.target.tagName||'').toLowerCase();\n      if (tag==='input' || tag==='textarea') return;\n      if ((e.key==='Delete'||e.key==='Backspace') && this.state.group && this.state.group.length){ e.preventDefault(); this.deleteGroup(); return; }\n      if ((e.key==='Delete'||e.key==='Backspace') && this.state.selId){ e.preventDefault(); this.deleteSel(); }\n      if ((e.metaKey||e.ctrlKey) && (e.key==='z'||e.key==='Z')){ e.preventDefault(); this.undo(); }\n    };\n    window.addEventListener('pointermove', this._move);\n    window.addEventListener('pointerup', this._up);\n    window.addEventListener('keydown', this._key);\n  }\n  componentWillUnmount(){\n    window.removeEventListener('pointermove', this._move);\n    window.removeEventListener('pointerup', this._up);\n    window.removeEventListener('keydown', this._key);\n  }\n  componentDidUpdate(){\n    try {\n      const { floors, active, tool, selId, selType } = this.state;\n      localStorage.setItem('fpstudio_v1', JSON.stringify({ floors, active, tool, selId, selType }));\n    } catch(e){}\n  }\n\n  cur(){ return this.state.floors[this.state.active] || this.state.floors[0] || { name:'Level 1', rooms:[], openings:[], stairs:[] }; }\n  mutate(fn){\n    if (!this._dragging) this.snapshot();\n    this.setState(s => ({ floors: s.floors.map((f,i)=> i===s.active ? fn({ ...f, rooms:f.rooms.map(r=>({...r})), openings:f.openings.map(o=>({...o})), stairs:(f.stairs||[]).map(t=>({...t})) }) : f) }));\n  }\n  patchRoom(id, ch){ this.mutate(f => ({ ...f, rooms: f.rooms.map(r => r.id===id ? { ...r, ...ch } : r) })); }\n  patchOpen(id, ch){ this.mutate(f => ({ ...f, openings: f.openings.map(o => o.id===id ? { ...o, ...ch } : o) })); }\n  patchItem(coll, id, ch){ this.mutate(f => ({ ...f, [coll]: (f[coll]||[]).map(it => it.id===id ? { ...it, ...ch } : it) })); }\n\n  pt(e){\n    const b = this.layer.getBoundingClientRect();\n    const k = this.state.scale || 1;\n    return { x: (e.clientX - b.left)/k, y: (e.clientY - b.top)/k };\n  }\n  lenOf(o){ return (o.kind==='open'||o.kind==='base'||o.kind==='upper') ? (o.len||60) : (o.kind==='door'?DOOR:WIN); }\n  isCab(o){ return o.kind==='base' || o.kind==='upper'; }\n  nearestOpening(p){\n    const cands=[];\n    for (const o of this.cur().openings){\n      const r = this.cur().rooms.find(x=>x.id===o.roomId); if (!r) continue;\n      const horiz = (o.side==='top'||o.side==='bottom');\n      const cx = horiz ? r.x+o.off : (o.side==='left'? r.x : r.x+r.w);\n      const cy = horiz ? (o.side==='top'? r.y : r.y+r.h) : r.y+o.off;\n      const half = this.lenOf(o)/2;\n      let d;\n      if (horiz){ const dx=Math.max(0, Math.abs(p.x-cx)-half); d=Math.hypot(dx, p.y-cy); }\n      else { const dy=Math.max(0, Math.abs(p.y-cy)-half); d=Math.hypot(p.x-cx, dy); }\n      if (d<=22) cands.push({ o, d });\n    }\n    if (!cands.length) return null;\n    cands.sort((a,b)=>a.d-b.d);\n    // if the currently-selected opening is under the click, cycle to the next one; else nearest\n    const selIdx = cands.findIndex(c=>c.o.id===this.state.selId);\n    const idx = selIdx>=0 ? (selIdx+1)%cands.length : 0;\n    return cands[idx].o;\n  }\n  snapAxis(v, cands){\n    for (const c of cands) if (Math.abs(v-c) < SNAP) return c;\n    return Math.round(v/GRID)*GRID;\n  }\n  snapBox(v, size, cands){\n    let adj=null, best=SNAP+1;\n    for (const c of cands){\n      if (Math.abs(v-c) < best){ best=Math.abs(v-c); adj=c-v; }\n      if (Math.abs(v+size-c) < best){ best=Math.abs(v+size-c); adj=c-(v+size); }\n    }\n    return adj!=null ? v+adj : Math.round(v/GRID)*GRID;\n  }\n  candsFor(exceptId){\n    const xs=[], ys=[];\n    for (const r of [...this.cur().rooms, ...(this.cur().stairs||[])]){ if (r.id===exceptId) continue; xs.push(r.x, r.x+r.w); ys.push(r.y, r.y+r.h); }\n    return { xs, ys };\n  }\n\n  canvasDown(e){\n    const p = this.pt(e);\n    this.snapshot(); this._dragging = true;\n    const tool = this.state.tool;\n    const hit = e.target.closest('[data-el]');\n    const kind = hit ? hit.dataset.el : null;\n\n    if (tool==='door' || tool==='window' || tool==='open' || tool==='base' || tool==='upper'){ this.addOpening(p, tool); return; }\n\n    if (tool==='plant'){\n      this.setState({ selId:null, selType:null });\n      const x=Math.round((p.x-15)/GRID)*GRID, y=Math.round((p.y-15)/GRID)*GRID;\n      const id=this.uid('s');\n      this.mutate(f => ({ ...f, stairs:[...(f.stairs||[]), { id, x, y, w:30, h:30, kind:'plant' }] }));\n      this.setState({ tool:'select', selId:id, selType:'stair' });\n      return;\n    }\n    const FURN = ['coffeetable','tv','couch','diningset'];\n    if (tool==='room' || tool==='hall' || tool==='stair' || tool==='island' || tool==='wallobj' || tool==='tile' || tool==='railing' || FURN.includes(tool)){\n      this.setState({ selId:null, selType:null });\n      this.drag = { type: (tool==='stair'||tool==='island'||tool==='wallobj'||tool==='tile'||tool==='railing'||FURN.includes(tool))?'drawstair':'draw', sx:p.x, sy:p.y, hall: tool==='hall', island: tool==='island', wallobj: tool==='wallobj'||tool==='railing', railing: tool==='railing', tile: tool==='tile', furn: FURN.includes(tool)?tool:null };\n      this.setState({ drawPrev:{ x:p.x, y:p.y, w:0, h:0 } });\n      return;\n    }\n\n    // select tool\n    if (kind==='handle'){\n      const id = hit.dataset.id, dir = hit.dataset.dir, coll = hit.dataset.coll;\n      const it = (this.cur()[coll]||[]).find(x=>x.id===id);\n      this.drag = { type:'resize', coll, id, dir, sx:p.x, sy:p.y, orig:{...it}, ...this.candsFor(id) };\n      return;\n    }\n    // openings: always resolve by nearest to the click, never by which box is on top\n    const near = this.nearestOpening(p);\n    if (near){\n      this.setState({ selId:near.id, selType:'opening', group:null });\n      this.drag = { type:'slide', id:near.id, orig:{...near} };\n      return;\n    }\n    if (kind==='room' || kind==='stair'){\n      const coll = kind==='stair' ? 'stairs' : 'rooms';\n      const id = hit.dataset.id;\n      const it = (this.cur()[coll]||[]).find(x=>x.id===id);\n      // if this item is part of a multi-selection, drag the whole group\n      if (this.state.group && this.state.group.includes(id)){\n        const items = this.groupItems();\n        this.drag = { type:'groupmove', sx:p.x, sy:p.y, orig: items.map(o=>({ coll:o.coll, id:o.id, x:o.x, y:o.y })) };\n        return;\n      }\n      this.setState({ selId:id, selType:kind, group:null });\n      this.drag = { type:'move', coll, id, sx:p.x, sy:p.y, orig:{...it}, ...this.candsFor(id) };\n      return;\n    }\n    // empty canvas: start a marquee box-select\n    this.setState({ selId:null, selType:null, group:null });\n    this.drag = { type:'marquee', sx:p.x, sy:p.y };\n    this.setState({ marquee:{ x:p.x, y:p.y, w:0, h:0 } });\n  }\n  groupItems(){\n    const g = this.state.group||[];\n    const all = [...this.cur().rooms.map(r=>({...r,coll:'rooms'})), ...(this.cur().stairs||[]).map(t=>({...t,coll:'stairs'}))];\n    return all.filter(o=>g.includes(o.id));\n  }\n\n  onMove(e){\n    if (this._pan){\n      const p=this.state.pan3d||{tx:0,ty:0,z:1,rot:0};\n      if (this._pan.mode==='pan'){\n        this.setState({ pan3d:{ ...p, tx:this._pan.tx+(e.clientX-this._pan.sx), ty:this._pan.ty+(e.clientY-this._pan.sy) } });\n      } else {\n        this.setState({ pan3d:{ ...p, rot:this._pan.rot+(e.clientX-this._pan.sx)*0.4 } });\n      }\n      return;\n    }\n    const d = this.drag; if (!d) return;\n    const p = this.pt(e);\n    if (d.type==='draw'){\n      const x=Math.min(d.sx,p.x), y=Math.min(d.sy,p.y), w=Math.abs(p.x-d.sx), h=Math.abs(p.y-d.sy);\n      this.setState({ drawPrev:{ x,y,w,h } });\n      return;\n    }\n    if (d.type==='move'){\n      const dx=p.x-d.sx, dy=p.y-d.sy;\n      const nx=this.snapBox(d.orig.x+dx, d.orig.w, d.xs);\n      const ny=this.snapBox(d.orig.y+dy, d.orig.h, d.ys);\n      this.patchItem(d.coll, d.id, { x:nx, y:ny });\n      return;\n    }\n    if (d.type==='marquee'){\n      const x=Math.min(d.sx,p.x), y=Math.min(d.sy,p.y), w=Math.abs(p.x-d.sx), h=Math.abs(p.y-d.sy);\n      this.setState({ marquee:{ x,y,w,h } });\n      return;\n    }\n    if (d.type==='groupmove'){\n      let dx=Math.round((p.x-d.sx)/GRID)*GRID, dy=Math.round((p.y-d.sy)/GRID)*GRID;\n      this.mutate(f => {\n        const mv = (arr) => arr.map(it=>{ const o=d.orig.find(q=>q.id===it.id); return o?{...it,x:o.x+dx,y:o.y+dy}:it; });\n        return { ...f, rooms:mv(f.rooms), stairs:mv(f.stairs||[]) };\n      });\n      return;\n    }\n    if (d.type==='resize'){\n      const dx=p.x-d.sx, dy=p.y-d.sy, o=d.orig;\n      const mn = (d.coll==='stairs' && o.kind==='wallseg') ? 4 : MIN;\n      let x=o.x, y=o.y, r=o.x+o.w, b=o.y+o.h;\n      if (d.dir.includes('e')) r=this.snapAxis(o.x+o.w+dx, d.xs);\n      if (d.dir.includes('w')) x=this.snapAxis(o.x+dx, d.xs);\n      if (d.dir.includes('s')) b=this.snapAxis(o.y+o.h+dy, d.ys);\n      if (d.dir.includes('n')) y=this.snapAxis(o.y+dy, d.ys);\n      if (r-x < mn){ if (d.dir.includes('w')) x=r-mn; else r=x+mn; }\n      if (b-y < mn){ if (d.dir.includes('n')) y=b-mn; else b=y+mn; }\n      this.patchItem(d.coll, d.id, { x, y, w:r-x, h:b-y });\n      return;\n    }\n    if (d.type==='slide'){\n      const o = this.cur().openings.find(x=>x.id===d.id);\n      const r = this.cur().rooms.find(x=>x.id===o.roomId);\n      if (!r) return;\n      const horiz = (o.side==='top'||o.side==='bottom');\n      const L = this.lenOf(o);\n      const wall = horiz ? r.w : r.h;\n      let off = horiz ? (p.x - r.x) : (p.y - r.y);\n      off = Math.max(L/2, Math.min(wall - L/2, off));\n      this.patchOpen(d.id, { off });\n      return;\n    }\n  }\n  onUp(){\n    if (this._pan){ this._pan=null; return; }\n    const d = this.drag; this.drag = null;\n    if (d && d.type==='marquee'){\n      const m = this.state.marquee; this.setState({ marquee:null });\n      if (!m || (m.w<12 && m.h<12)){ this.setState({ group:null }); return; }\n      const inBox = o => o.x < m.x+m.w && o.x+o.w > m.x && o.y < m.y+m.h && o.y+o.h > m.y;\n      const all = [...this.cur().rooms, ...(this.cur().stairs||[])];\n      const ids = all.filter(inBox).map(o=>o.id);\n      this.setState({ group: ids.length ? ids : null, selId:null, selType:null });\n      return;\n    }\n    if (d && (d.type==='groupmove')) return;\n    if (d && d.type==='draw'){\n      let { x, y, w, h } = this.state.drawPrev || {};\n      this.setState({ drawPrev:null });\n      if (w<40 || h<40){ w=Math.max(w,160); h=Math.max(h,120); }\n      x=Math.round(x/GRID)*GRID; y=Math.round(y/GRID)*GRID;\n      w=Math.round(w/GRID)*GRID; h=Math.round(h/GRID)*GRID;\n      // keep new room from landing on top of an existing one\n      const overlaps = (nx,ny)=> this.cur().rooms.some(r=>{\n        const ox=Math.max(nx,r.x), oy=Math.max(ny,r.y);\n        const ox2=Math.min(nx+w,r.x+r.w), oy2=Math.min(ny+h,r.y+r.h);\n        const iw=ox2-ox, ih=oy2-oy;\n        return iw>4 && ih>4 && (iw*ih) > 0.15*Math.min(w*h, r.w*r.h);\n      });\n      let guard=0;\n      while (overlaps(x,y) && guard<40){ x+=GRID; y+=GRID; guard++; }\n      const id=this.uid('r');\n      const hall = d.hall;\n      const palette = ['#ece5d6','#eae4d7','#e4e8e6','#efece4','#efe9dc','#e8dfe0','#dfe6e4'];\n      const color = hall ? '#e8e4da' : palette[this.cur().rooms.length % palette.length];\n      this.mutate(f => ({ ...f, rooms:[...f.rooms, { id, x, y, w, h, name: hall?'Hallway':'Room', color }] }));\n      this.setState({ tool:'select', selId:id, selType:'room' });\n    }\n    if (d && d.type==='drawstair'){\n      let { x, y, w, h } = this.state.drawPrev || {};\n      this.setState({ drawPrev:null });\n      if (w<50 || h<60){ w=Math.max(w,150); h=Math.max(h,190); }\n      x=Math.round(x/GRID)*GRID; y=Math.round(y/GRID)*GRID;\n      w=Math.round(w/GRID)*GRID; h=Math.round(h/GRID)*GRID;\n      const id=this.uid('s');\n      const item = d.furn ? { id, x, y, w, h, kind:d.furn }\n        : d.tile ? { id, x, y, w, h, kind:'tile' }\n        : d.railing ? { id, x, y, w:(Math.abs(w)>=Math.abs(h))?w:Math.max(w,6), h:(Math.abs(w)>=Math.abs(h))?Math.max(h,6):h, kind:'railing' }\n        : d.wallobj ? { id, x, y, w:(d.wallobj&&Math.abs(w)>=Math.abs(h))?w:Math.max(w,6), h:(d.wallobj&&Math.abs(w)>=Math.abs(h))?Math.max(h,6):h, kind:'wallseg' }\n        : d.island ? { id, x, y, w, h, kind:'island' } : { id, x, y, w, h, kind:'U', land:'top', dir:'up' };\n      this.mutate(f => ({ ...f, stairs:[...(f.stairs||[]), item] }));\n      this.setState({ tool:'select', selId:id, selType:'stair' });\n    }\n    this._dragging = false;\n  }\n\n  addOpening(p, kind){\n    const isCab = (kind==='base'||kind==='upper');\n    const probe = (kind==='open'||isCab) ? 40 : (kind==='door'?DOOR:WIN);\n    let best=null, bd=52;\n    for (const r of this.cur().rooms){\n      const inX = p.x>=r.x-14 && p.x<=r.x+r.w+14;\n      const inY = p.y>=r.y-14 && p.y<=r.y+r.h+14;\n      const walls=[\n        { side:'top', d:Math.abs(p.y-r.y), ok:inX, off:p.x-r.x, wall:r.w },\n        { side:'bottom', d:Math.abs(p.y-(r.y+r.h)), ok:inX, off:p.x-r.x, wall:r.w },\n        { side:'left', d:Math.abs(p.x-r.x), ok:inY, off:p.y-r.y, wall:r.h },\n        { side:'right', d:Math.abs(p.x-(r.x+r.w)), ok:inY, off:p.y-r.y, wall:r.h },\n      ];\n      for (const w of walls){ if (w.ok && w.d<bd && w.wall>=probe){ bd=w.d; best={ roomId:r.id, side:w.side, wall:w.wall, rawoff:w.off }; } }\n    }\n    if (!best) return;\n    const len = (kind==='open'||isCab) ? Math.max(60, best.wall-24) : (kind==='door'?DOOR:WIN);\n    const off = Math.max(len/2, Math.min(best.wall-len/2, best.rawoff));\n    const id=this.uid('o');\n    const item = { id, roomId:best.roomId, side:best.side, off, kind, flip:false };\n    if (kind==='open'||isCab) item.len = len;\n    this.mutate(f => ({ ...f, openings:[...f.openings, item] }));\n    this.setState({ tool:'select', selId:id, selType:'opening' });\n  }\n  setOpenLen(dir){\n    const o=this.cur().openings.find(x=>x.id===this.state.selId); if(!o||!(o.kind==='open'||o.kind==='base'||o.kind==='upper'))return;\n    const r=this.cur().rooms.find(x=>x.id===o.roomId); if(!r)return;\n    const horiz=(o.side==='top'||o.side==='bottom'); const wall=horiz?r.w:r.h;\n    const len=Math.max(16, Math.min(wall-8, (o.len||100)+dir*24));\n    const off=Math.max(len/2, Math.min(wall-len/2, o.off));\n    this.patchOpen(o.id,{len,off});\n  }\n  fullWall(){\n    const o=this.cur().openings.find(x=>x.id===this.state.selId); if(!o||o.kind!=='open')return;\n    const r=this.cur().rooms.find(x=>x.id===o.roomId); if(!r)return;\n    const horiz=(o.side==='top'||o.side==='bottom'); const wall=horiz?r.w:r.h;\n    this.patchOpen(o.id,{len:wall-8, off:wall/2});\n  }\n\n  setStairKind(k){\n    const st=(this.c      const py = horiz ? (o.side==='top'? r.y : r.y+r.h) : r.y+o.off;\n        const rx = cx + (py - cy), ry = cy - (px - cx); // 90° CW\n        let side, off;\n        const d = { top:Math.abs(ry-ny), bottom:Math.abs(ry-(ny+nh)), left:Math.abs(rx-nx), right:Math.abs(rx-(nx+nw)) };\n        side = Object.keys(d).reduce((a,b)=>d[a]<d[b]?a:b);\n        off = (side==='top'||side==='bottom') ? rx-nx : ry-ny;\n        const L = this.lenOf(o);\n        const wall = (side==='top'||side==='bottom') ? nw : nh;\n        off = Math.max(L/2, Math.min(wall-L/2, off));\n        return { ...o, side, off };\n      })\n    }));\n  }\n  swingOut(){ const o=this.cur().openings.find(x=>x.id===this.state.selId); if (o) this.patchOpen(o.id, { out:!o.out }); }\n\n  // split rooms into ground/upper layers; upper rooms are aligned over the ground plan\n  planLayers(){\n    const rooms = this.cur().rooms;\n    const opens = this.cur().openings;\n    const stairs = this.cur().stairs||[];\n    const lower = rooms.filter(r=>!r.up);\n    const upper = rooms.filter(r=>r.up);\n    const bbox = list => { let a=1e9,b=1e9,c=-1e9,d=-1e9; list.forEach(r=>{ a=Math.min(a,r.x);b=Math.min(b,r.y);c=Math.max(c,r.x+r.w);d=Math.max(d,r.y+r.h); }); return {a,b,c,d}; };\n    let dx=0, dy=0;\n    if (upper.length && lower.length){\n      const lb=bbox(lower), ub=bbox(upper);\n      dx = lb.a - ub.a; dy = lb.b - ub.b; // align top-left corners\n    }\n    const layers = [];\n    layers.push({ rooms:lower, opens, stairs, dx:0, dy:0, level:0 });\n    if (upper.length) layers.push({ rooms:upper, opens, stairs, dx, dy, level:1 });\n    return layers;\n  }\n  // ---- isometric 3D ----\n  build3D(){\n    const H = 82, STORY = 88, SILL = 26, HEAD = 56, ISO = 0.5, COSX = 0.9;\n    const rot = ((this.state.pan3d||{}).rot||0) * Math.PI/180;\n    const cs = Math.cos(rot), sn = Math.sin(rot);\n    const allRooms = this.cur().rooms;\n    let cx=0, cy=0;\n    if (allRooms.length){\n      let a=1e9,b=1e9,c=-1e9,d=-1e9;\n      al .y+dy, horiz:false, len:r.h },\n        ];\n        for (const sd of sides){\n          const ptAt = d => sd.horiz ? { x:sd.ax+d, y:sd.ay } : { x:sd.ax, y:sd.ay+d };\n          const ops = opens.filter(o=>o.roomId===r.id && o.side===sd.side && o.kind!=='base' && o.kind!=='upper')\n            .map(o=>{ const L=this.lenOf(o); return { s:o.off-L/2, e:o.off+L/2, kind:o.kind }; })\n            .sort((a,b)=>a.s-b.s);\n          const mid = { x: sd.horiz? sd.ax+sd.len/2 : sd.ax, y: sd.horiz? sd.ay : sd.ay+sd.len/2 };\n          const depth = depthOf(mid.x, mid.y) + lift;\n          const fill = shade(WALLC, sideShade[sd.side]);\n          const seg = (d0,d1,z0,z1)=>{\n            const p0=ptAt(d0), p1=ptAt(d1);\n            const A=proj(p0.x,p0.y,zBase+z0), B=proj(p1.x,p1.y,zBase+z0), C=proj(p1.x,p1.y,zBase+z1), D=proj(p0.x,p0.y,zBase+z1);\n            track([A,B,C,D]);\n            wallFaces.push({ depth, pts:quad(A,B,C,D), fill, stroke:'#9a927f' });\n          };\n          let cursor = 0;\n          for (const op of ops){\n            const s=Math.max(0,op.s), e=Math.min(sd.len,op.e);\n            if (s>cursor) seg(cursor, s, 0, H);\n            if (op.kind==='window'){ seg(s,e,0,SILL); seg(s,e,HEAD,H); }\n            cursor = Math.max(cursor, e);\n          }\n          if (cursor < sd.len) seg(cursor, sd.len, 0, H);\n        }\n      }\n      wallFaces.sort((a,b)=>a.depth-b.depth).forEach(w=>{ faces.push(w); });\n    }\n    faces.sort((a,b)=>a.depth-b.depth);\n    const pad=40, w=(maxX-minX)+pad*2, h=(maxY-minY)+pad*2;\n    return { vb:`${(minX-pad).toFixed(1)} ${(minY-pad).toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`, faces };\n  }\n  // ---- Spanish-style massing 3D ----\n  buildSpanish3D(){\n    const H = 78, RH = 44, EAVE = 8, STORY = 82, SILL = 24, HEAD = 52, ISO = 0.5, COSX = 0.9;\n    const rooms = this.cur().rooms;\n    const opens = this.cur().openings;\n    const rot = ((this.state.pan3d||{}).rot||0) * Math.PI/180;\n    const cs = Math.cos(rot), sn = Math.s  pts.map(([dir,px,py,cur2])=>({\n        rid:r.id, dir, coll:hColl,\n        style:`position:absolute;left:${px-o}px;top:${py-o}px;width:${H}px;height:${H}px;background:#fff;border:2px solid ${ACCENT};border-radius:2px;cursor:${cur2}-resize;z-index:20;`\n      }));\n    }\n\n    const stairs = (cur.stairs||[]).map(st => {\n      const seld = s.selId===st.id && s.selType==='stair';\n      const ing = grp.includes(st.id);\n      const g = this.stairGeom(st);\n      return {\n        id:st.id,\n        style:`position:absolute;left:${st.x}px;top:${st.y}px;width:${st.w}px;height:${st.h}px;background:#f2eee4;border:2px solid #6f665a;box-sizing:border-box;overflow:hidden;cursor:${s.tool==='select'?'move':'crosshair'};z-index:${seld||ing?5:2};${(seld||ing)?`box-shadow:0 0 0 2px ${ACCENT};`:''}`,\n        parts:g.parts, vb:`0 0 ${st.w} ${st.h}`,\n        svgStyle:`position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;`,\n        arrow:g.arrow, head:g.head, stroke: seld?ACCENT:'#5c564b',\n        label: (st.kind==='island'||st.kind==='wallseg'||st.kind==='tile'||st.kind==='plant'||st.kind==='railing'||['coffeetable','tv','couch','diningset'].includes(st.kind)) ? '' : 'UP', labelStyle:`position:absolute;left:5px;top:3px;font-size:9px;font-weight:700;letter-spacing:1px;color:#8a8172;pointer-events:none;`\n      };\n    });\n\n    const openings = cur.openings.map(o => {\n      const r = cur.rooms.find(x=>x.id===o.roomId);\n      if (!r) return null;\n      const seld = s.selId===o.id;\n      const stroke = seld ? ACCENT : '#5c5344';\n      if (o.kind==='base' || o.kind==='upper'){\n        const horiz=(o.side==='top'||o.side==='bottom'), L=this.lenOf(o);\n        const D = o.kind==='base' ? 9 : 6;\n        const cx=r.x+o.off, cy=r.y+o.off;\n        let box;\n        if (o.side==='top') box={left:cx-L/2,top:r.y+1,width:L,height:D};\n        else if (o.side==='bottom') box={left:cx-L/2,top:r.y+r.h-1-D,width:L,height:D};\n        else if (o.side==='left') box={left:r.x+1,top:cy-L/2,width:D,height:L};\n        else box={left:r.x+r.w-1-D,top:cy-L/2,width:D,height:L};\n        const base = o.kind==='base';\n        const fill = base ? '#cbb391' : 'rgba(203,179,145,0.25)';\n        const bord = base ? '#a1855f' : '#a1855f';\n        const dash = base ? 'none' : 'dashed';\n        return {\n          id:o.id, isCab:true, isOpen:false, isDoor:false, isWindow:false,\n          cabStyle:`position:absolute;left:${box.left}px;top:${box.top}px;width:${box.width}px;height:${box.height}px;background:${fill};border:1px ${dash} ${bord};box-sizing:border-box;z-index:6;cursor:grab;${seld?`box-shadow:0 0 0 2px ${ACCENT};`:''}`\n        };\n      }\n      if (o.kind==='open'){\n        const horiz=(o.side==='top'||o.side==='bottom'), L=this.lenOf(o), cutT=11;\n        const cx=r.x+o.off, cy=r.y+o.off;\n        let wrap, jHoriz;\n        if (o.side==='top'){ wrap={left:cx-L/2,top:r.y-cutT/2,width:L,height:cutT}; jHoriz=true; }\n        else if (o.side==='bottom'){ wrap={left:cx-L/2,top:r.y+r.h-cutT/2,width:L,height:cutT}; jHoriz=true; }\n        else if (o.side==='left'){ wrap={left:r.x-cutT/2,top:cy-L/2,width:cutT,height:L}; jHoriz=false; }\n        else { wrap={left:r.x+r.w-cutT/2,top:cy-L/2,width:cutT,height:L}; jHoriz=false; }\n        const j1 = jHoriz ? `position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:15px;background:${WALL};` : `position:absolute;top:0;left:50%;transform:translateX(-50%);height:3px;width:15px;background:${WALL};`;\n        const j2 = jHoriz ? `position:absolute;right:0;top:50%;transform:translateY(-50%);width:3px;height:15px;background:${WALL};` : `position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:3px;width:15px;background:${WALL};`;\n        return {\n          id:o.id, isOpen:true, isDoor:false, isWindow:false,\n          wrapStyle:`position:absolute;left:${wrap.left}px;top:${wrap.top}px;width:${wrap.width}px;height:${wrap.height}px;background:${r.color};z-index:6;pointer-events:none;cursor:grab;${seld?`box-shadow:0 0 0 2px ${ACCENT};`:''}`,\n          jamb1:j1, jamb2:j2\n        };\n      }\n      if (o.kind==='door'){\n        const g = this.doorGeom(r, o);\n        return {\n          id:o.id, isOpen:false, isDoor:true, isWindow:false, stroke,\n          path:g.path,\n          cutStyle:`position:absolute;left:${g.cut.left}px;top:${g.cut.top}px;width:${g.cut.width}px;height:${g.cut.height}px;background:${r.color};z-index:3;cursor:pointer;`,\n          wrapStyle:`position:absolute;left:${g.wrap.left}px;top:${g.wrap.top}px;width:${g.wrap.width}px;height:${g.wrap.height}px;overflow:visible;z-index:6;pointer-events:none;cursor:grab;transform:${g.tf||'none'};${seld?`filter:drop-shadow(0 0 2px ${ACCENT});`:''}`\n        };\n      } else {\n        const horiz = (o.side==='top'||o.side==='bottom'), L=WIN, cutT=11;\n        const cx=r.x+o.off, cy=r.y+o.off;\n        let wrap;\n        if (o.side==='top') wrap={left:cx-L/2,top:r.y-cutT/2,width:L,height:cutT};\n        else if (o.side==='bottom') wrap={left:cx-L/2,top:r.y+r.h-cutT/2,width:L,height:cutT};\n        else if (o.side==='left') wrap={left:r.x-cutT/2,top:cy-L/2,width:cutT,height:L};\n        else wrap={left:r.x+r.w-cutT/2,top:cy-L/2,width:cutT,height:L};\n        const winLine = horiz\n          ? `position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:2.5px;background:${seld?ACCENT:'#7d94a3'};`\n          : `position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:2.5px;background:${seld?ACCENT:'#7d94a3'};`;\n        return {\n          id:o.id, isOpen:false, isDoor:false, isWindow:true, stroke,\n          cutStyle:`position:absolute;left:${wrap.left}px;top:${wrap.top}px;width:${wrap.width}px;height:${wrap.height}px;background:${r.color};z-index:3;`,\n          wrapStyle:`position:absolute;left:${wrap.left}px;top:${wrap.top}px;width:${wrap.width}px;height:${wrap.height}px;z-index:6;cursor:grab;`,\n          winLine\n        };\n      }\n    }).filter(Boolean);\n\n    const dp = s.drawPrev;\n    const drawStyle = dp ? `position:absolute;left:${dp.x}px;top:${dp.y}px;width:${dp.w}px;height:${dp.h}px;border:2px dashed ${ACCENT};background:rgba(176,106,67,.08);z-index:30;pointer-events:none;` : '';\n\n    const selRoom = s.selType==='room' ? cur.rooms.find(x=>x.id===s.selId) : null;\n    const selOpen = s.selType==='opening' ? cur.openings.find(x=>x.id===s.selId) : null;\n    const selStair = s.selType==='stair' ? (cur.stairs||[]).find(x=>x.id===s.selId) : null;\n    const optBtn=(active)=>`padding:8px 12px;border:1px solid ${active?ACCENT:'#cfc7b6'};background:${active?ACCENT:'#f6f3ec'};color:${active?'#fff':'#5c564b'};border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;text-align:left;`;\n    const shapeBtns = [['straight','Straight'],['L','L-shaped (90\\u00b0 turn)'],['U','U-shaped (switchback)']].map(([k,l])=>({\n      label:l, onClick:()=>this.setStairKind(k), style:optBtn(selStair && selStair.kind===k)\n    }));\n    let stairOptDefs = [];\n    if (selStair){\n      if (selStair.kind==='straight') stairOptDefs=[['up','Up \\u2191'],['down','Down \\u2193'],['left','Left \\u2190'],['right','Right \\u2192']];\n      else if (selStair.kind==='U') stairOptDefs=[['top','Landing at top'],['bottom','Landing at bottom'],['left','Landing at left'],['right','Landing at right']];\n      else stairOptDefs=[['bl','Turn at bottom-left'],['br','Turn at bottom-right'],['tl','Turn at top-left'],['tr','Turn at top-right']];\n    }\n    const stairOpts = stairOptDefs.map(([v,l])=>({\n      label:l, onClick:()=>this.setStairOpt(v),\n      style:optBtn((selStair.kind==='straight'?selStair.dir:selStair.land)===v)\n    }));\n    const swatches = SW.map(c => ({\n      onPick:()=>this.pickColor(c),\n      style:`width:30px;height:30px;border-radius:6px;background:${c};cursor:pointer;border:2px solid ${selRoom&&selRoom.color===c?ACCENT:'#d8d1c2'};`\n    }));\n\n    return {\n      hint:`${(s.group&&s.group.length)?s.group.length+' selected — drag to move together · ':''}${cur.rooms.length} room${cur.rooms.length===1?'':'s'} · ${Math.round(cur.rooms.reduce((a,r)=>a+r.w*r.h,0)/100).toLocaleString()} sq ft on ${cur.name}`,\n      areaRows: cur.rooms.map((r,i)=>({\n        name: r.name || 'Room',\n        sqft: Math.round(r.w*r.h/100).toLocaleString()+' sq ft',\n        style:`display:flex;justify-content:space-between;padding:9px 12px;font-size:12.5px;${i%2?'background:#f0ece2;':'background:#f6f3ec;'}`\n      })),\n      areaTotalLabel: `${cur.name} total`,\n      areaTotal: Math.round(cur.rooms.reduce((a,r)=>a+r.w*r.h,0)/100).toLocaleString()+' sq ft',\n      tools, floors,\n      addFloor:()=>this.addFloor(),\n      delStyle:`padding:8px 14px;border:1px solid ${(s.selId||(s.group&&s.group.length))?'#c98a6a':'#d8d1c2'};background:${(s.selId||(s.group&&s.group.length))?'#f3e3db':'#efeae0'};color:${(s.selId||(s.group&&s.group.length))?'#9a4a28':'#b9b0a0'};border-radius:8px;font-size:12px;font-weight:600;cursor:${(s.selId||(s.group&&s.group.length))?'pointer':'default'};`,\n      save:()=>this.save(),\n      triggerLoad:()=>this.triggerLoad(),\n      loadSpanish:()=>this.loadPlanFile('plan-spanish-house.json'),\n      loadNewHouse:()=>this.loadPlanFile('plan-new-house.json'),\n      onLoadFile:(e)=>this.onLoadFile(e),\n      setFileInput:(el)=>{ this.fileInput=el; },\n      setLayer:(el)=>{ this.layer=el; },\n      canvasDown:(e)=>this.canvasDown(e),\n      rooms, openings, stairs, handles,\n      drawPrev: !!dp, drawStyle,\n      hasMarquee: !!s.marquee,\n      marqueeStyle: s.marquee ? `position:absolute;left:${s.marquee.x}px;top:${s.marquee.y}px;width:${s.marquee.w}px;height:${s.marquee.h}px;border:1.5px dashed ${ACCENT};background:rgba(176,106,67,.09);z-index:40;pointer-events:none;` : '',\n      isStairSel: s.selType==='stair' && !!selStair && selStair.kind!=='island' && selStair.kind!=='wallseg' && selStair.kind!=='tile' && selStair.kind!=='plant' && selStair.kind!=='railing' && !['coffeetable','tv','couch','diningset'].includes(selStair.kind),\n      isIslandSel: s.selType==='stair' && !!selStair && selStair.kind==='island',\n      isWallSel: s.selType==='stair' && !!selStair && selStair.kind==='wallseg',\n      isTileSel: s.selType==='stair' && !!selStair && selStair.kind==='tile',\n      isRailingSel: s.selType==='stair' && !!selStair && selStair.kind==='railing',\n      isFurnSel: s.selType==='stair' && !!selStair && ['coffeetable','tv','couch','diningset'].includes(selStair.kind),\n      furnLabel: selStair ? ({coffeetable:'COFFEE TABLE',tv:'TV',couch:'COUCH',diningset:'DINING SET'}[selStair.kind]||'') : '',\n      isPlantSel: s.selType==='stair' && !!selStair && selStair.kind==='plant',\n      shapeBtns, stairOpts,\n      isRoomSel: s.selType==='room' && !!selRoom,\n      isOpenSel: s.selType==='opening' && !!selOpen && selOpen.kind!=='open' && selOpen.kind!=='base' && selOpen.kind!=='upper',\n      isOpenWallSel: s.selType==='opening' && !!selOpen && selOpen.kind==='open',\n      isCabSel: s.selType==='opening' && !!selOpen && (selOpen.kind==='base'||selOpen.kind==='upper'),\n      cabKind: selOpen ? (selOpen.kind==='base'?'BASE CABINET':(selOpen.kind==='upper'?'UPPER CABINET':'')) : '',\n      isDoorSel: !!(selOpen && selOpen.kind==='door'),\n      widenOpen:()=>this.setOpenLen(1),\n      narrowOpen:()=>this.setOpenLen(-1),\n      fullWall:()=>this.fullWall(),\n      nothingSel: !s.selId && !(s.group && s.group.length),\n      groupSel: !!(s.group && s.group.length),\n      groupCount: (s.group && s.group.length) ? `${s.group.length} rooms` : '',\n      liftLabel: (()=>{ const g=s.group||[]; const up=this.cur().rooms.filter(r=>g.includes(r.id)&&r.up).length; return up? 'Drop to ground floor' : 'Lift to upper floor'; })(),\n      liftGroup:()=>this.liftGroup(),\n      selName: selRoom ? selRoom.name : '',\n      selDims: selRoom ? `Position ${selRoom.x} , ${selRoom.y} · ${selRoom.w}\\u00d7${selRoom.h} px` : '',\n      openKind: selOpen ? selOpen.kind.toUpperCase() : '',\n      onName:(e)=>this.onName(e),\n      swatches,\n      duplicateSel:()=>this.duplicateSel(),\n      rotateRoomSel:()=>this.rotateRoomSel(),\n      deleteSel:()=>{ if (!this.state.selId && this.state.group && this.state.group.length) this.deleteGroup(); else this.deleteSel(); },\n      undo:()=>this.undo(),\n      toggle3d:()=>this.toggle3d(),\n      scale: s.scale || 1,\n      houseGrow:()=>this.resizeHouse(1),\n      houseShrink:()=>this.resizeHouse(-1),\n      pan3dDown:(e)=>this.pan3dDown(e),\n      pan3dWheel:(e)=>this.pan3dWheel(e),\n      pan3dTransform:(()=>{ const p=s.pan3d||{tx:0,ty:0,z:1}; return `translate(${p.tx||0}px,${p.ty||0}px) scale(${p.z||1})`; })(),\n      threeD: s.view==='3d' || s.view==='spanish',\n      v3: s.view==='3d' ? this.build3D() : (s.view==='spanish' ? this.buildSpanish3D() : { vb:'0 0 10 10', faces:[] }),\n      view3dLabel: s.view==='3d' ? '2D plan' : '3D view',\n      view3dStyle:`padding:8px 14px;border:1px solid ${s.view==='3d'?ACCENT:'#33302a'};background:${s.view==='3d'?ACCENT:'#efeae0'};color:${s.view==='3d'?'#fff':'#35322b'};border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;`,\n      toggleSpanish:()=>this.toggleSpanish(),\n      spanishLabel: s.view==='spanish' ? '2D plan' : 'Spanish 3D',\n      spanishStyle:`padding:8px 14px;border:1px solid ${s.view==='spanish'?'#b8552f':'#33302a'};background:${s.view==='spanish'?'#b8552f':'#efeae0'};color:${s.view==='spanish'?'#fff':'#35322b'};border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;`,\n      undoStyle:`padding:8px 14px;border:1px solid ${(this._history&&this._history.length)?'#33302a':'#d8d1c2'};background:#efeae0;color:${(this._history&&this._history.length)?'#35322b':'#b9b0a0'};border-radius:8px;font-size:12px;font-weight:600;cursor:${(this._history&&this._history.length)?'pointer':'default'};`,\n      flipDoor:()=>this.flipDoor(),\n      swingOut:()=>this.swingOut(),\n    };\n  }\n}\n<\
